name: Weekly data update

on:
  schedule:
    - cron: "0 12 * * 2"   # Tuesday morning, after Monday Night Football
    - cron: "0 14 * * 6"   # Saturday morning, after Friday's final injury reports
    - cron: "0 15 * * 0"   # Sunday morning, last-minute injury updates
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache past seasons of raw data
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-data-${{ github.run_id }}
          restore-keys: raw-data-
      - run: pip install -r requirements.txt
      - run: python scripts/update.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/ff.db data/metrics.json data/experiments.json models/models.joblib
          git diff --cached --quiet || git commit -m "Weekly data update"
          git push
